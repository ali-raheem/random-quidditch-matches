<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Random Quidditch Matches</title>
  <meta name="description" content="Endless procedurally generated Quidditch matches. Works offline.">
  <meta name="theme-color" content="#0e1424">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <!-- Icon sprite: 24×24 line icons drawn in currentColor; use as <svg class="icon"><use href="#i-name"/></svg>. -->
  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <symbol id="i-play" viewBox="0 0 24 24"><path d="M8 5.5v13l10.5-6.5z" fill="currentColor"/></symbol>
    <symbol id="i-pause" viewBox="0 0 24 24"><rect x="6.5" y="5.5" width="3.5" height="13" rx="1" fill="currentColor"/><rect x="14" y="5.5" width="3.5" height="13" rx="1" fill="currentColor"/></symbol>
    <symbol id="i-next" viewBox="0 0 24 24"><path d="M5.5 6v12l9-6z" fill="currentColor"/><path d="M18.5 6v12"/></symbol>
    <symbol id="i-roster" viewBox="0 0 24 24"><path d="M9 6.5h11M9 12h11M9 17.5h11"/><circle cx="4.75" cy="6.5" r="1.25" fill="currentColor" stroke="none"/><circle cx="4.75" cy="12" r="1.25" fill="currentColor" stroke="none"/><circle cx="4.75" cy="17.5" r="1.25" fill="currentColor" stroke="none"/></symbol>
    <symbol id="i-recent" viewBox="0 0 24 24"><path d="M3 12a9 9 0 1 0 3-6.7L3 8"/><path d="M3 3v5h5"/><path d="M12 7.5V12l3.5 2"/></symbol>
    <symbol id="i-settings" viewBox="0 0 24 24"><path d="M4 6h10M18 6h2M4 12h2M10 12h10M4 18h8M16 18h4"/><circle cx="16" cy="6" r="2"/><circle cx="8" cy="12" r="2"/><circle cx="14" cy="18" r="2"/></symbol>
    <symbol id="i-sound" viewBox="0 0 24 24"><path d="M3.5 9.5H7L11.5 5.5v13L7 14.5H3.5z"/><path d="M15 9a4 4 0 0 1 0 6"/><path d="M17.5 6.5a7.5 7.5 0 0 1 0 11"/></symbol>
    <symbol id="i-sound-off" viewBox="0 0 24 24"><path d="M3.5 9.5H7L11.5 5.5v13L7 14.5H3.5z"/><path d="M15.5 9.5l5 5M20.5 9.5l-5 5"/></symbol>
    <symbol id="i-names" viewBox="0 0 24 24"><path d="M3.5 7.5a2 2 0 0 1 2-2h7l6.5 6.5-7 7-6.5-6.5a2 2 0 0 1-2-2z"/><circle cx="8" cy="9.5" r="1.3" fill="currentColor" stroke="none"/></symbol>
    <symbol id="i-fullscreen" viewBox="0 0 24 24"><path d="M4 9V4h5M15 4h5v5M20 15v5h-5M9 20H4v-5"/></symbol>
    <symbol id="i-hide" viewBox="0 0 24 24"><path d="M3 12s3.5-6 9-6 9 6 9 6-3.5 6-9 6-9-6-9-6z"/><circle cx="12" cy="12" r="2.5"/><path d="M4 4l16 16"/></symbol>
    <symbol id="i-install" viewBox="0 0 24 24"><path d="M12 4v11"/><path d="M7.5 10.5L12 15l4.5-4.5"/><path d="M5 19.5h14"/></symbol>
    <symbol id="i-link" viewBox="0 0 24 24"><path d="M10 14a4 4 0 0 0 5.7 0l3-3a4 4 0 0 0-5.7-5.7l-1 1"/><path d="M14 10a4 4 0 0 0-5.7 0l-3 3a4 4 0 0 0 5.7 5.7l1-1"/></symbol>
  </svg>

  <canvas id="view" aria-label="Quidditch match"></canvas>

  <div id="hud">
    <header id="teams" aria-live="off"></header>
    <div id="meta"><span id="match-name"></span> · <span id="clock">0:00</span> · <button id="seed" title="Copy a link that replays this match"></button></div>
    <ol id="feed" aria-live="polite"></ol>

    <div id="banner" hidden>
      <div class="kicker"></div>
      <div class="title"></div>
      <div class="sub"></div>
    </div>

    <aside id="roster" class="panel" hidden aria-label="Line-ups"></aside>
    <aside id="recent" class="panel" hidden aria-label="Recent matches"></aside>
    <aside id="settings" class="panel" hidden aria-label="Settings">
      <h2>Settings</h2>
      <button class="row" id="set-install" hidden><svg class="icon"><use href="#i-install"/></svg><span>Install app<small></small></span></button>
      <button class="row" id="set-sound" role="switch"><svg class="icon"><use href="#i-sound"/></svg><span>Sound</span><i class="switch"></i></button>
      <button class="row" id="set-names" role="switch"><svg class="icon"><use href="#i-names"/></svg><span>Player names<small>the ball carrier and chasing Seekers always show</small></span><i class="switch"></i></button>
      <button class="row" id="set-full" role="switch"><svg class="icon"><use href="#i-fullscreen"/></svg><span>Fullscreen</span><i class="switch"></i></button>
      <button class="row" id="set-hide"><svg class="icon"><use href="#i-hide"/></svg><span>Hide interface<small>tap the screen or press H to bring it back</small></span></button>
      <dl class="keys">
        <dt>Space</dt><dd>pause</dd><dt>+ −</dt><dd>speed</dd><dt>N</dt><dd>next match</dd>
        <dt>R</dt><dd>line-ups</dd><dt>L</dt><dd>recent</dd><dt>S</dt><dd>settings</dd>
        <dt>M</dt><dd>sound</dd><dt>T</dt><dd>names</dd><dt>F</dt><dd>fullscreen</dd><dt>H</dt><dd>hide interface</dd>
      </dl>
      <p class="version" id="version"></p>
    </aside>

    <nav id="controls" aria-label="Controls">
      <button id="btn-pause" title="Pause (Space)" aria-label="Pause"><svg class="icon"><use href="#i-pause"/></svg></button>
      <button id="btn-speed" title="Simulation speed (+/−)" aria-label="Simulation speed">1×</button>
      <button id="btn-next" title="Next match (N)" aria-label="Next match"><svg class="icon"><use href="#i-next"/></svg></button>
      <button id="btn-roster" title="Line-ups (R)" aria-label="Line-ups"><svg class="icon"><use href="#i-roster"/></svg></button>
      <button id="btn-recent" title="Recent matches (L)" aria-label="Recent matches"><svg class="icon"><use href="#i-recent"/></svg></button>
      <button id="btn-settings" title="Settings (S)" aria-label="Settings"><svg class="icon"><use href="#i-settings"/></svg></button>
    </nav>
  </div>

  <script type="module" src="js/app.js"></script>
</body>
</html>
